[env:waveshare-amoled-1.64]
platform = espressif32@6.3.2
board = esp32-s3-devkitc-1
framework = arduino

; --- Основные определения платы ---
-DDEVICE_NAME='"Waveshare AMOLED 1.64"'
-DUSE_LVGL=1
-DUSE_LGFX=1

; --- Конфигурация дисплея (QSPI, SH8601) ---
-DTFT_WIDTH=280
-DTFT_HEIGHT=456
-DTFT_BL=21  ; Управление подсветкой (если поддерживается драйвером)
; Пины QSPI (из вашего описания)
-DTFT_CS=9
-DTFT_SCK=10
-DTFT_D0=11
-DTFT_D1=12
-DTFT_D2=13
-DTFT_D3=14
-DTFT_RST=21

; --- Конфигурация тачскрина (I2C, FT3168) ---
-DTOUCH_I2C_SDA=47
-DTOUCH_I2C_SCL=48

; --- Конфигурация SD-карты (SPI) ---
-DSD_CS=38
-DSD_MOSI=39
-DSD_MISO=40
-DSD_SCK=41
